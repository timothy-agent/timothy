name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels that PR's in-flight run; pushes to main
# never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.4-pg18-trixie
        env:
          POSTGRES_USER: timothy
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: timothy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U timothy -d timothy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Integration test
        env:
          DATABASE_URL: postgres://timothy:ci@localhost:5432/timothy
        run: go test -race -count=1 -tags integration ./internal/...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  web:
    runs-on: ubuntu-latest
    env:
      # HugeIcons Pro registry auth (web/.npmrc references it by name)
      HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [brain, gateway, memoryd, web]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        env:
          # Web only: HugeIcons Pro registry auth, passed as a BuildKit
          # secret so it never lands in an image layer.
          HUGEICONS_TOKEN: ${{ secrets.HUGEICONS_TOKEN }}
        run: |
          if [ "${{ matrix.service }}" = "web" ]; then
            docker build -f web/Dockerfile \
              --secret id=hugeicons_token,env=HUGEICONS_TOKEN \
              -t timothy-web:ci web
          else
            docker build -f deploy/Dockerfile \
              --build-arg SERVICE=${{ matrix.service }} \
              -t timothy-${{ matrix.service }}:ci .
          fi
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: timothy-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # Separate from `images`: the sandbox is a general-purpose dev toolbox
  # (python3/node/npm/pip) whose dependency tree trips HIGH-severity
  # CVEs routinely — a CRITICAL,HIGH,exit-code=1 gate on it would make
  # CI red on churn unrelated to this repo. Scan for visibility
  # (uploaded as a run summary), don't block merges on it.
  sandbox-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f deploy/sandbox.Dockerfile -t timothy-sandbox:ci .
      - name: Scan image (informational only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: timothy-sandbox:ci
          severity: CRITICAL,HIGH
          exit-code: "0"
          ignore-unfixed: true

  # Umbrella gate with a stable name for branch rulesets: matrix legs
  # report as "images (brain)" etc., which rulesets can't reference.
  # ALLOWLIST, not blocklist: every needed job must report exactly
  # "success" — failure, cancelled, skipped, and any future state all
  # fail the gate. (A cancelled run once reported skipped needs, the
  # old blocklist missed it, and auto-merge fired on red jobs.)
  ci-ok:
    runs-on: ubuntu-latest
    needs: [go, lint, web, images, sandbox-image]
    if: always()
    steps:
      - name: All jobs succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "needs results: $results"
          [ -n "$results" ] || { echo "no results reported"; exit 1; }
          for r in $results; do
            [ "$r" = "success" ] || { echo "gate failed: job result '$r'"; exit 1; }
          done
