name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# One release run per tag, no cancellation: a half-published set of
# multi-arch images or a half-assembled GitHub release is worse than a
# slow one, and tags are immutable so there's never a newer run to
# prefer over an in-flight one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No test jobs here on purpose: releases are cut by tagging a commit
  # on main that already went green through ci-ok. Re-running build/
  # vet/test/lint against the same commit here would only slow the
  # release down for no new signal.

  # Decides which of the 8 images actually need a rebuild for this
  # tag. Diffs against the previous release tag (not the previous
  # commit): a service skipped across several no-op releases in a row
  # must still be compared against the last tag that actually built
  # it, or a real change could be missed. First-ever release (no
  # previous tag) marks everything changed.
  diff:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      brain: ${{ steps.diff.outputs.brain }}
      gateway: ${{ steps.diff.outputs.gateway }}
      memoryd: ${{ steps.diff.outputs.memoryd }}
      sandboxd: ${{ steps.diff.outputs.sandboxd }}
      web: ${{ steps.diff.outputs.web }}
      markitdown: ${{ steps.diff.outputs.markitdown }}
      whisper: ${{ steps.diff.outputs.whisper }}
      sandbox: ${{ steps.diff.outputs.sandbox }}
      prev_tag: ${{ steps.prev.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: prev
        run: |
          prev=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          echo "tag=$prev" >> "$GITHUB_OUTPUT"
      - id: diff
        run: |
          if [ -z "${{ steps.prev.outputs.tag }}" ]; then
            echo "no previous release tag; building everything"
            for name in brain gateway memoryd sandboxd web markitdown whisper sandbox; do
              echo "$name=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi
          files=$(git diff --name-only "${{ steps.prev.outputs.tag }}" "$GITHUB_SHA")
          changed() { echo "$files" | grep -qE "$1"; }
          go_pattern='^(go\.mod|go\.sum|migrations/|internal/|cmd/|deploy/Dockerfile)'
          for name in brain gateway memoryd sandboxd; do
            changed "$go_pattern" && echo "$name=true" >> "$GITHUB_OUTPUT" || echo "$name=false" >> "$GITHUB_OUTPUT"
          done
          changed '^web/' && echo "web=true" >> "$GITHUB_OUTPUT" || echo "web=false" >> "$GITHUB_OUTPUT"
          changed '^markitdown-svc/' && echo "markitdown=true" >> "$GITHUB_OUTPUT" || echo "markitdown=false" >> "$GITHUB_OUTPUT"
          changed '^whisper-svc/' && echo "whisper=true" >> "$GITHUB_OUTPUT" || echo "whisper=false" >> "$GITHUB_OUTPUT"
          changed '^deploy/sandbox-.*\.Dockerfile$' && echo "sandbox=true" >> "$GITHUB_OUTPUT" || echo "sandbox=false" >> "$GITHUB_OUTPUT"

  images:
    needs: diff
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - name: brain
            context: .
            dockerfile: deploy/Dockerfile
            build-args: |
              SERVICE=brain
            target: runtime-shell
          - name: gateway
            context: .
            dockerfile: deploy/Dockerfile
            build-args: |
              SERVICE=gateway
          - name: memoryd
            context: .
            dockerfile: deploy/Dockerfile
            build-args: |
              SERVICE=memoryd
          - name: sandboxd
            context: .
            dockerfile: deploy/Dockerfile
            build-args: |
              SERVICE=sandboxd
          - name: web
            context: web
            dockerfile: web/Dockerfile
            secret: "true"
          - name: markitdown
            context: markitdown-svc
            dockerfile: markitdown-svc/Dockerfile
          - name: whisper
            context: whisper-svc
            dockerfile: whisper-svc/Dockerfile
            build-args: |
              WHISPER_MODEL=large-v3
    steps:
      - uses: actions/checkout@v7
        if: fromJSON(needs.diff.outputs[matrix.name])
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: fromJSON(needs.diff.outputs[matrix.name])
      # Always set up buildx: the copy-forward step below (unchanged
      # images) also needs it for `docker buildx imagetools create`.
      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        if: fromJSON(needs.diff.outputs[matrix.name])
        uses: useblacksmith/build-push-action@v2
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          # GIT_SHA/APP_VERSION are appended for every image, harmlessly
          # ignored by Dockerfiles that don't declare the ARG. Sourced
          # from the tag, not package.json, so the web sidebar's version
          # can never drift from what was actually released.
          build-args: |
            ${{ matrix.build-args }}
            GIT_SHA=${{ steps.sha.outputs.short }}
            APP_VERSION=${{ steps.version.outputs.value }}
          # web only: HugeIcons Pro registry auth, passed as a BuildKit
          # secret so it never lands in an image layer (not as a
          # build-arg or env, both of which persist into layer history).
          secrets: ${{ matrix.secret == 'true' && format('hugeicons_token={0}', secrets.HUGEICONS_TOKEN) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          # repository_owner, not a literal: survives org renames and
          # keeps images under whatever org the repo lives in.
          tags: ghcr.io/${{ github.repository_owner }}/timothy-${{ matrix.name }}:${{ steps.version.outputs.value }}
      # Unchanged image: no rebuild, just point the new version tag at
      # the previous release's manifest list. Keeps every tag pinned
      # to a real image (no floating tags) without paying for a
      # redundant multi-arch build.
      - name: Copy forward unchanged image
        if: needs.diff.outputs.prev_tag != '' && !fromJSON(needs.diff.outputs[matrix.name])
        run: |
          prev_version="${{ needs.diff.outputs.prev_tag }}"
          prev_version="${prev_version#v}"
          docker buildx imagetools create \
            --tag ghcr.io/${{ github.repository_owner }}/timothy-${{ matrix.name }}:${{ steps.version.outputs.value }} \
            ghcr.io/${{ github.repository_owner }}/timothy-${{ matrix.name }}:${prev_version}

  # Sandbox family: five variants FROM the base, so the base must be
  # pushed before any variant builds — buildx can't resolve a
  # cross-arch base from the local docker store the way single-stage
  # images can. A matrix job's legs run in parallel with no ordering
  # between them, so this is a single sequential job instead of a
  # matrix leg. The family is all-or-nothing: any sandbox-*.Dockerfile
  # change rebuilds and re-pushes all six images together, even if
  # only one variant actually changed — simpler than tracking which
  # variants use which lines of the base, and rebuilds are cheap
  # relative to the base's own apt/node layers being cached.
  #
  # timothy-sandbox keeps publishing the base image (back-compat
  # alias, matches the local `make sandbox-image` tagging convention
  # of tagging the base as both timothy-sandbox-base and
  # timothy-sandbox) rather than renaming it — nothing outside this
  # workflow needs to change to keep pulling the base under its
  # original name.
  #
  # Unlike service images, the family's copy-forward lives inside this
  # same job (per-step ifs) rather than a matrix conditional: the
  # release compose pins MISSION_SANDBOX_IMAGE to the release version
  # and sandboxd derives variant refs from it, so every release MUST
  # have all six sandbox tags — a skipped job would leave them
  # dangling and break the first mission of each environment.
  sandbox-images:
    needs: diff
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: fromJSON(needs.diff.outputs.sandbox)
      - name: Setup Blacksmith Builder
        if: fromJSON(needs.diff.outputs.sandbox)
        uses: useblacksmith/setup-docker-builder@v2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy forward unchanged family
        if: needs.diff.outputs.prev_tag != '' && !fromJSON(needs.diff.outputs.sandbox)
        run: |
          prev_version="${{ needs.diff.outputs.prev_tag }}"
          prev_version="${prev_version#v}"
          for name in sandbox sandbox-base sandbox-go sandbox-node sandbox-python sandbox-java sandbox-php; do
            docker buildx imagetools create \
              --tag ghcr.io/${{ github.repository_owner }}/timothy-$name:${{ steps.version.outputs.value }} \
              ghcr.io/${{ github.repository_owner }}/timothy-$name:${prev_version}
          done
      - name: Build and push base
        if: fromJSON(needs.diff.outputs.sandbox)
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: deploy/sandbox-base.Dockerfile
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
            APP_VERSION=${{ steps.version.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/timothy-sandbox:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/timothy-sandbox-base:${{ steps.version.outputs.value }}
      - name: Build and push variants
        if: fromJSON(needs.diff.outputs.sandbox)
        run: |
          for lang in go node python java php; do
            docker buildx build \
              --file deploy/sandbox-$lang.Dockerfile \
              --build-arg SANDBOX_BASE=ghcr.io/${{ github.repository_owner }}/timothy-sandbox-base:${{ steps.version.outputs.value }} \
              --build-arg GIT_SHA=${{ steps.sha.outputs.short }} \
              --build-arg APP_VERSION=${{ steps.version.outputs.value }} \
              --platform linux/amd64,linux/arm64 \
              --push \
              --tag ghcr.io/${{ github.repository_owner }}/timothy-sandbox-$lang:${{ steps.version.outputs.value }} \
              .
          done

  release:
    needs: [images, sandbox-images]
    if: needs.images.result == 'success' && needs.sandbox-images.result == 'success'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Assemble release assets
        run: |
          mkdir -p /tmp/release-assets
          cp deploy/release/docker-compose.yml /tmp/release-assets/docker-compose.yml
          cp deploy/release/env.example /tmp/release-assets/env.example
          cp deploy/release/install.sh /tmp/release-assets/install.sh
          cp deploy/searxng/settings.yml /tmp/release-assets/searxng-settings.yml
          sed -i "s/__TIMOTHY_TAG__/${{ steps.version.outputs.value }}/g" \
            /tmp/release-assets/env.example /tmp/release-assets/install.sh
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # Prerelease only for pre-release tags (-alpha/-beta/-rc etc.):
        # a hyphen in the version marks it as such per semver, a bare
        # vX.Y.Z does not.
        run: |
          args=(--generate-notes --title "$GITHUB_REF_NAME")
          case "${{ steps.version.outputs.value }}" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            /tmp/release-assets/docker-compose.yml \
            /tmp/release-assets/env.example \
            /tmp/release-assets/install.sh \
            /tmp/release-assets/searxng-settings.yml
