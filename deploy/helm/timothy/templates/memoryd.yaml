{{- $sel := dict "root" . "svc" "memoryd" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-memoryd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "timothy.labels" . | nindent 4 }}
    app.kubernetes.io/component: memoryd
spec:
  selector:
    {{- include "timothy.selector" $sel | nindent 4 }}
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-memoryd
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "timothy.labels" . | nindent 4 }}
    app.kubernetes.io/component: memoryd
spec:
  # One replica: memory extraction and consolidation run in-process.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "timothy.selector" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "timothy.selector" $sel | nindent 8 }}
      annotations:
        {{- include "timothy.metricsAnnotations" (dict "root" . "port" 8082) | nindent 8 }}
    spec:
      serviceAccountName: {{ .Release.Name }}-memoryd
      automountServiceAccountToken: false
      {{- include "timothy.pullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "timothy.podSecurityContext" (dict "uid" 65532) | nindent 8 }}
      containers:
        - name: memoryd
          image: {{ include "timothy.image" $sel }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "timothy.containerSecurityContext" . | nindent 12 }}
          env:
            - name: PORT
              value: "8082"
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            {{- include "timothy.databaseEnv" . | nindent 12 }}
            - name: GATEWAY_URL
              value: http://{{ .Release.Name }}-gateway:8081
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.memoryd.resources | nindent 12 }}
