{{- $root := . }}
{{- $services := list "brain" "gateway" "memoryd" "sandboxd" "web" "searxng" "markitdown" "pdfgen" "ocr" }}
{{- if .Values.whisper.enabled }}{{ $services = append $services "whisper" }}{{ end }}
{{- range $svc := $services }}
{{- $cfg := index $root.Values $svc }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "timothy.svc" (dict "root" $root "svc" $svc) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "timothy.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $svc }}
  {{- with $cfg.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Only sandboxd talks to the API server; every other pod also sets
# automountServiceAccountToken false on the pod.
automountServiceAccountToken: {{ eq $svc "sandboxd" }}
{{- end }}
