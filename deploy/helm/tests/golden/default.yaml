      automountServiceAccountToken: false
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: brain
          image: ghcr.io/timothy-agent/timothy-brain:0.1.0-alpha.108
