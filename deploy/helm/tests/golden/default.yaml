# Source: timothy/templates/ingress.yaml
# web only: brain is reached through web's same-origin /v1 proxy.
# Authentication in front of this (OIDC forward-auth) is the ingress
# controller's job; Timothy's own API token still applies behind it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: timothy-web
  namespace: timothy
  labels:
    app.kubernetes.io/name: timothy
    app.kubernetes.io/instance: timothy
    app.kubernetes.io/version: "0.1.0-alpha.108"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: timothy-0.1.0
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - timothy.example.com
      secretName: timothy-tls
  rules:
    - host: timothy.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: timothy-web
                port:
                  name: http
