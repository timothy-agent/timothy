            - name: SANDBOXD_URL
              value: http://timothy-sandboxd:8083
            - name: SEARXNG_URL
              value: http://timothy-searxng:8080
            - name: MARKITDOWN_URL
              value: http://timothy-markitdown:8000
            - name: PDFGEN_URL
              value: http://timothy-pdfgen:8000
            - name: OCR_URL
              value: http://timothy-ocr:8000
            - name: WHISPER_URL
