# kind cluster for the Kubernetes sandbox backend (make kind-up).
# One node: the workspace claim is ReadWriteOnce here, which every pod
# on the same node can share; a real cluster needs ReadWriteMany.
#
# The node mounts brain's own Docker workspace volume (the compose
# stack's timothy_workspace, by its path inside the Docker host), and
# deploy/kind/sandbox.yaml turns it into a hostPath PV, so a mission
# directory brain provisions under Compose is the one a sandbox pod
# mounts with its subPath.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: timothy
nodes:
  - role: control-plane
    extraMounts:
      - hostPath: /var/lib/docker/volumes/timothy_workspace/_data
        containerPath: /mnt/timothy-workspace
