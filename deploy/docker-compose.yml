name: timothy

x-service: &service
  restart: unless-stopped
  networks: [timothy]
  logging: &logging
    options:
      max-size: "10m"
      max-file: "3"

x-go-service: &go-service
  <<: *service
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/app", "-healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s

x-db-env: &db-env
  DATABASE_URL: postgres://timothy:${POSTGRES_PASSWORD}@postgres:5432/timothy
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    <<: *service
    image: pgvector/pgvector:0.8.4-pg18-trixie
    environment:
      POSTGRES_USER: timothy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: timothy
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timothy -d timothy"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    <<: *service
    image: searxng/searxng@sha256:aaf56bb5ad737d48a8a375778d42eb4ab1757231e6b1eb7980e71d8dd5bdf0de
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ../deploy/searxng:/etc/searxng:ro
    # internal-only: no published ports; brain is the sole caller

  markitdown:
    <<: *service
    build:
      context: ../markitdown-svc
    # internal-only: no published ports, no auth; brain is the sole
    # caller, same trust boundary as searxng.

  pdfgen:
    <<: *service
    build:
      context: ../pdfgen-svc
    # internal-only: no published ports, no auth; brain is the sole
    # caller, same trust boundary as searxng/markitdown.

  whisper:
    <<: *service
    profiles: [whisper]
    build:
      context: ../whisper-svc
      args:
        WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
    # internal-only: no published ports, no auth; brain is the sole
    # caller, same trust boundary as searxng/markitdown. No user-facing
    # knob in deploy/env.example — WHISPER_MODEL defaults to
    # "large-v3": smaller models (tried up to "medium") misidentify
    # some languages entirely (e.g. Bangla decoded as Hindi even with
    # the language explicitly forced), not just lower accuracy within
    # the right language. Slower per clip and a bigger image, but
    # dictation is not latency-sensitive the way live transcription
    # would be.
    # Off by default: the model holds ~3 GiB RSS at idle. Enable with
    # COMPOSE_PROFILES=whisper and WHISPER_URL=http://whisper:8001 in
    # .env.

  # Local models: run Ollama natively on the host (Metal/CUDA — a
  # containerized runner gets CPU only and can't serve big models) and
  # register http://host.docker.internal:11434/v1 in Settings as a
  # regular "openaicompat" provider — no gateway code needed.

  brain:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: brain}
      # brain gets the alpine stage: the shell tool needs /bin/sh
      target: runtime-shell
    environment:
      <<: *db-env
      PORT: "8080"
      GATEWAY_URL: http://gateway:8081
      MEMORYD_URL: http://memoryd:8082
      # Brain-only secret: the public API bearer token.
      TIMOTHY_API_TOKEN: ${TIMOTHY_API_TOKEN:-}
      # Connector credentials resolve through brain's own secret-store
      # handle — same key the gateway uses.
      TIMOTHY_MASTER_KEY: ${TIMOTHY_MASTER_KEY:?set TIMOTHY_MASTER_KEY in deploy/.env}
      # Public base URL (as the browser sees it) for OAuth redirects;
      # empty disables google connector OAuth.
      TIMOTHY_PUBLIC_URL: ${TIMOTHY_PUBLIC_URL:-}
      # Where the shell tool runs; the only tree tools may touch.
      WORKSPACE_ROOT: /workspace
      # Root for mission workspaces/worktrees; unset disables the
      # missions feature entirely (API surface stays unmounted).
      WORKSPACES: /workspace/missions
      # Models too weak to drive tool-using mission work (substring
      # match on the served model id). A turn served by one pauses the
      # mission as infra instead of burning iterations on a model that
      # cannot do the job — the small local fallback exists for chat
      # resilience, not for missions.
      MISSION_MODEL_FLOOR: ${MISSION_MODEL_FLOOR:-qwen2.5:7b}
      # Detached-turn ceiling override (Go duration, e.g. "60m").
      # Empty keeps the compiled 30m default; must exceed 10m. Raise it
      # alongside a slow provider's request_timeout so the two
      # deadlines never land at the same instant.
      TURN_TIMEOUT: ${TURN_TIMEOUT:-}
      # Non-empty enables the agentic workflows layer (D-070):
      # orchestration above missions. Off by default.
      WORKFLOWS_ENABLED: ${WORKFLOWS_ENABLED:-}
      # Compose-internal only: the model never sees this address.
      SEARXNG_URL: http://searxng:8080
      # Converts Gmail attachments (PDFs) and HTML-only email bodies to
      # markdown/text; compose-internal only.
      MARKITDOWN_URL: http://markitdown:8000
      # Renders markdown to PDF (mission export, chat export, PDF
      # tool); compose-internal only.
      PDFGEN_URL: http://pdfgen:8000
      # Local speech-to-text for the web mic button; compose-internal
      # only, audio never leaves the box. Empty by default (feature
      # off) since whisper itself defaults off — see its service
      # comment.
      WHISPER_URL: ${WHISPER_URL:-}
      # sandboxd's internal address — mission shell/verify_cmd execution
      # always runs there; brain never touches the Docker socket
      # directly.
      SANDBOXD_URL: http://sandboxd:8083
      # Content-addressed image attachment bytes (metadata only in
      # Postgres); compose-internal path, not user-facing.
      ATTACHMENTS_DIR: /attachments
    volumes:
      - workspace:/workspace
      - attachments:/attachments
    ports:
      - "${BRAIN_PORT:-8300}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      markitdown:
        condition: service_started
      sandboxd:
        condition: service_started
    networks: [timothy, timothy-sandbox]

  # Holds the Docker socket on brain's behalf: the only service that
  # talks to the Docker daemon, exposing a narrow mission-scoped API
  # (missionID in — never container names, images, mounts, env) that
  # brain's sandboxclient calls instead. Not a *go-service: no postgres
  # dependency, no database at all.
  sandboxd:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: sandboxd}
      # Default (distroless) target — sandboxd's own shell tool never
      # runs here; commands execute inside the sandbox containers it
      # creates, not in this one.
    environment:
      PORT: "8083"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Built by `make sandbox-image` (deploy/sandbox.Dockerfile) —
      # always this fixed tag locally, same as every other local image
      # in this file has no separate version-tag env of its own.
      MISSION_SANDBOX_IMAGE: timothy-sandbox:latest
    volumes:
      # Metadata-only read: resolveWorkspaceMount inspects this mount to
      # learn the exact volume/bind spec, then replicates it (rw) into
      # each sandbox container it creates — sandboxd itself never reads
      # or writes mission files through this mount. A container's own
      # replicated mount is unaffected by the ro flag here.
      - workspace:/workspace:ro
      # D-054: executor auth-state (headless claude CLI's subscription
      # login), same metadata-only self-inspection pattern as workspace
      # above — resolveMount reads this mount's spec, then replicates it
      # rw at /home/sandbox/.claude in every mission container. Optional:
      # missions using API-key auth (ANTHROPIC_API_KEY via per-exec env,
      # D-053) work fine without ever populating this volume.
      #
      # Preferred subscription path: run `claude setup-token` on any
      # machine with the claude CLI installed, paste the resulting
      # sk-ant-oat… token into Settings → Secrets, then point the
      # provider row's credential_ref at that secret name — resolveCredential
      # classifies it as oauth_token auth automatically (no volume, no
      # /login, works across sandbox rebuilds and restarts).
      #
      # The volume + /login flow below is the fallback for harnesses
      # without a token equivalent. One-off subscription login, run once
      # after `make sandbox-image`. The chown comes first because compose
      # initializes this volume through the metadata mount below
      # (distroless, path absent from the image), which leaves a fresh
      # volume root-owned while the CLI runs as 65534:
      #   docker run --rm -u 0 -v timothy_executor-claude-state:/s timothy-sandbox:latest chown 65534:65534 /s
      #   docker run --rm -it -v timothy_executor-claude-state:/home/sandbox/.claude timothy-sandbox:latest claude /login
      - executor-claude-state:/statevols/claude
      # Host meminfo — under LXC, lxcfs serves the guest's real memory
      # limit here, while this container's own /proc shows the
      # hypervisor's (Capacity's admission gate would otherwise read a
      # 32 GB host on a 4 GB guest). No-op bind on bare metal.
      - /proc/meminfo:/host/meminfo:ro
      # The socket this service exists to hold instead of brain.
      # group_add grants its group inside the container; Docker
      # Desktop's socket is group 0 (root), Linux hosts typically use a
      # "docker" group with an arbitrary gid — override via
      # DOCKER_SOCK_GID in deploy/.env if 0 doesn't work on your host.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCK_GID:-0}"
    # Hardening against non-socket bugs in this service — it cannot stop
    # the socket itself being root-equivalent, but everything else about
    # the container is locked down.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    # internal-only: no published ports; brain is the sole caller.
    # Second network (not just `timothy`): sandboxd is strictly more
    # privileged than any other internal service (it holds the socket),
    # so it reaches only brain, not searxng/markitdown/web. No
    # auth header on the API — a shared secret would have to live in
    # brain's own env, the exact thing this split assumes may be
    # compromised (same reasoning as memoryd's unauthenticated internal
    # API).
    networks: [timothy-sandbox]

  gateway:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: gateway}
    environment:
      <<: *db-env
      PORT: "8081"
      GATEWAY_FAILURE_CAPTURE_DIR: ${GATEWAY_FAILURE_CAPTURE_DIR:-}
      # Root of trust for the encrypted secret store (base64, 32
      # bytes). Generate with: openssl rand -base64 32. Provider
      # credentials are configured in Settings, not env — this key is
      # what decrypts them.
      TIMOTHY_MASTER_KEY: ${TIMOTHY_MASTER_KEY:?set TIMOTHY_MASTER_KEY in deploy/.env}
    # internal-only: no published ports

  memoryd:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: memoryd}
    environment:
      <<: *db-env
      PORT: "8082"
      GATEWAY_URL: http://gateway:8081
    # internal-only: no published ports

  web:
    <<: *service
    build:
      context: ../web
      args:
        GIT_SHA: ${GIT_SHA:-}
        APP_VERSION: ${APP_VERSION:-}
      # HugeIcons Pro registry auth for npm ci, passed as a BuildKit
      # secret (name-only ref; the value lives in deploy/.env, never in
      # the repo or an image layer).
      secrets: [hugeicons_token]
    environment:
      # nginx proxy target for /v1 (browser stays same-origin)
      BRAIN_URL: http://brain:8080
    ports:
      - "${WEB_PORT:-3300}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Vite dev server with hot reload; opt in with --profile dev. Uses
  # its own port so it can run alongside the production web service.
  web-dev:
    <<: *service
    profiles: [dev]
    image: node:24.18.0-alpine
    working_dir: /app
    environment:
      # Vite dev proxy target for /v1 (browser stays same-origin)
      BRAIN_URL: http://brain:8080
      # HugeIcons Pro registry auth for npm install (name-only ref;
      # the value lives in deploy/.env, never in the repo)
      HUGEICONS_TOKEN: ${HUGEICONS_TOKEN}
    # npm install, not ci: ci wipes node_modules first, defeating the
    # cache volume. install syncs against the lockfile and is fast when
    # the volume is already populated.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_DEV_PORT:-3301}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

secrets:
  hugeicons_token:
    environment: HUGEICONS_TOKEN

volumes:
  pgdata:
  web_node_modules:
  workspace:
  attachments:
  # D-054: headless claude CLI's subscription auth state, shared across
  # mission containers — see the sandboxd service comment above for the
  # one-off login command.
  executor-claude-state:

networks:
  timothy:
  # brain + sandboxd only — see the sandboxd service comment.
  timothy-sandbox:
