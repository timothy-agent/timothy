name: timothy

x-service: &service
  restart: unless-stopped
  networks: [timothy]
  logging: &logging
    options:
      max-size: "10m"
      max-file: "3"

x-go-service: &go-service
  <<: *service
  depends_on:
    postgres:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "/app", "-healthcheck"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 10s

x-db-env: &db-env
  DATABASE_URL: postgres://timothy:${POSTGRES_PASSWORD}@postgres:5432/timothy
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    <<: *service
    image: pgvector/pgvector:0.8.4-pg18-trixie
    environment:
      POSTGRES_USER: timothy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: timothy
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timothy -d timothy"]
      interval: 5s
      timeout: 3s
      retries: 10

  searxng:
    <<: *service
    image: searxng/searxng@sha256:aaf56bb5ad737d48a8a375778d42eb4ab1757231e6b1eb7980e71d8dd5bdf0de
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ../deploy/searxng:/etc/searxng:ro
    # internal-only: no published ports; brain is the sole caller

  markitdown:
    <<: *service
    build:
      context: ../markitdown-svc
    # internal-only: no published ports, no auth; brain is the sole
    # caller, same trust boundary as searxng.

  # Local model runner: an OpenAI-compatible endpoint at /v1, registered
  # in Settings as a regular "openaicompat" provider — no gateway code
  # needed. Pull a model once with:
  #   docker compose exec ollama ollama pull qwen2.5:14b
  ollama:
    <<: *service
    image: ollama/ollama@sha256:c3886c198155aa7d45a29851100cc16f5d6ea6777d635ddd0597fe95874161af
    volumes:
      - ollama-models:/root/.ollama
    # internal-only by default; uncomment to reach it from the host
    # (e.g. `ollama pull` from your Mac instead of via compose exec):
    # ports:
    #   - "${OLLAMA_PORT:-11434}:11434"

  brain:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: brain}
      # brain gets the alpine stage: the shell tool needs /bin/sh
      target: runtime-shell
    environment:
      <<: *db-env
      PORT: "8080"
      GATEWAY_URL: http://gateway:8081
      MEMORYD_URL: http://memoryd:8082
      # Brain-only secret: the public API bearer token.
      TIMOTHY_API_TOKEN: ${TIMOTHY_API_TOKEN:-}
      # Connector credentials resolve through brain's own secret-store
      # handle — same key the gateway uses.
      TIMOTHY_MASTER_KEY: ${TIMOTHY_MASTER_KEY:?set TIMOTHY_MASTER_KEY in deploy/.env}
      # Public base URL (as the browser sees it) for OAuth redirects;
      # empty disables google connector OAuth.
      TIMOTHY_PUBLIC_URL: ${TIMOTHY_PUBLIC_URL:-}
      # Where the shell tool runs; the only tree tools may touch.
      WORKSPACE_ROOT: /workspace
      # Root for mission workspaces/worktrees; unset disables the
      # missions feature entirely (API surface stays unmounted).
      WORKSPACES: /workspace/missions
      # Models too weak to drive tool-using mission work (substring
      # match on the served model id). A turn served by one pauses the
      # mission as infra instead of burning iterations on a model that
      # cannot do the job — the small local fallback exists for chat
      # resilience, not for missions.
      MISSION_MODEL_FLOOR: ${MISSION_MODEL_FLOOR:-qwen2.5:7b}
      # Compose-internal only: the model never sees this address.
      SEARXNG_URL: http://searxng:8080
      # Converts Gmail attachments (PDFs) and HTML-only email bodies to
      # markdown/text; compose-internal only.
      MARKITDOWN_URL: http://markitdown:8000
      # Optional: a route name (configured in Settings → Routing,
      # normally chained only to a local Ollama provider) that gmail_read
      # and gmail_read_attachment force the rest of their turn onto —
      # keeps real email content off third-party providers. Empty: those
      # tools' output is processed on whatever route the turn started on.
      SENSITIVE_TOOL_ROUTE: ${SENSITIVE_TOOL_ROUTE:-}
      # Image tag for per-mission sandbox containers (`make
      # sandbox-image`) — model-authored shell/verify_cmd execution
      # moves out of brain's own process into one of these instead of
      # brain's process, so it never inherits brain's secrets. Empty
      # (the default) keeps the original in-process exec behavior.
      MISSION_SANDBOX_IMAGE: ${MISSION_SANDBOX_IMAGE:-}
    volumes:
      - workspace:/workspace
      # Lets brain create/exec/remove per-mission sandbox containers via
      # the Docker Go SDK — a no-op mount when MISSION_SANDBOX_IMAGE is
      # unset. group_add grants the socket's group inside the container;
      # Docker Desktop's socket is group 0 (root), Linux hosts typically
      # use a "docker" group with an arbitrary gid — override via
      # DOCKER_SOCK_GID in deploy/.env if 0 doesn't work on your host.
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_SOCK_GID:-0}"
    ports:
      - "${BRAIN_PORT:-8300}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      searxng:
        condition: service_started
      markitdown:
        condition: service_started

  gateway:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: gateway}
    environment:
      <<: *db-env
      PORT: "8081"
      # Root of trust for the encrypted secret store (base64, 32
      # bytes). Generate with: openssl rand -base64 32. Provider
      # credentials are configured in Settings, not env — this key is
      # what decrypts them.
      TIMOTHY_MASTER_KEY: ${TIMOTHY_MASTER_KEY:?set TIMOTHY_MASTER_KEY in deploy/.env}
    # Bedrock (driver 'bedrock') reads the AWS default credential
    # chain. Local dev: run `aws sso login --profile <name>` on the
    # host and set the bedrock provider's credential_ref to that
    # profile. Config and credentials mount read-only; the SDK rotates
    # SSO access tokens itself and must write them back, so the token
    # cache alone is writable.
    volumes:
      - ${HOME}/.aws:/home/nonroot/.aws:ro
      - ${HOME}/.aws/sso/cache:/home/nonroot/.aws/sso/cache
    # internal-only: no published ports

  memoryd:
    <<: *go-service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: memoryd}
    environment:
      <<: *db-env
      PORT: "8082"
      GATEWAY_URL: http://gateway:8081
    # internal-only: no published ports

  web:
    <<: *service
    build:
      context: ../web
      # HugeIcons Pro registry auth for npm ci, passed as a BuildKit
      # secret (name-only ref; the value lives in deploy/.env, never in
      # the repo or an image layer).
      secrets: [hugeicons_token]
    environment:
      # nginx proxy target for /v1 (browser stays same-origin)
      BRAIN_URL: http://brain:8080
    ports:
      - "${WEB_PORT:-3300}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Vite dev server with hot reload; opt in with --profile dev. Uses
  # its own port so it can run alongside the production web service.
  web-dev:
    <<: *service
    profiles: [dev]
    image: node:24.18.0-alpine
    working_dir: /app
    environment:
      # Vite dev proxy target for /v1 (browser stays same-origin)
      BRAIN_URL: http://brain:8080
      # HugeIcons Pro registry auth for npm install (name-only ref;
      # the value lives in deploy/.env, never in the repo)
      HUGEICONS_TOKEN: ${HUGEICONS_TOKEN}
    # npm install, not ci: ci wipes node_modules first, defeating the
    # cache volume. install syncs against the lockfile and is fast when
    # the volume is already populated.
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_DEV_PORT:-3301}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

secrets:
  hugeicons_token:
    environment: HUGEICONS_TOKEN

volumes:
  pgdata:
  web_node_modules:
  workspace:
  ollama-models:

networks:
  timothy:
